<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Unique Studio 3.0</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><aside><div class="brand"><b>◈</b><div>VIDEO UNIQUE<small>STUDIO 3.0</small></div></div><nav id="nav"></nav><a class="legacy" href="vus://studio/">Открыть редактор 2.2 ↗</a><div class="local">● Локальная обработка</div></aside><main><header><div><small>ВАША МОНТАЖНАЯ</small><h1 id="title">Главная</h1></div><div class="actions"><button id="importTop">＋ Добавить видео</button><button id="theme" title="Переключить тему">◐</button></div></header><div class="workspace"><section class="viewer"><div class="viewerHead"><span id="sourceName">Выберите исходное видео</span><select id="compareMode" aria-label="Сравнение"><option value="split">Рядом</option><option value="wipe">Разделитель</option></select></div><div id="stage" class="stage"><div class="videoBox before"><video id="before" preload="metadata"></video><span>Исходник</span></div><div class="videoBox after"><video id="after" preload="metadata" muted></video><span>Результат</span></div><div id="empty">◈<h2>Новый взгляд на ваше видео</h2><p>Импортируйте ролики. Настройте цвет, слои и фактуру.</p><button id="importEmpty">Выбрать видео</button></div></div><input id="wipe" type="range" min="0" max="100" value="50" aria-label="Разделитель сравнения" hidden><div class="transport"><button id="backFrame" title="Предыдущий кадр">|◁</button><button id="play">▶</button><button id="nextFrame" title="Следующий кадр">▷|</button><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Временная шкала"><span id="clock">0:00</span><select id="zoom" aria-label="Масштаб"><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></div><div class="previewActions"><button id="preview">Создать предпросмотр · 5 с</button><label><input type="checkbox" id="fullPreview"> Весь ролик</label></div><div id="sources" class="sources"></div><div id="section" class="section"></div></section><section class="inspector"><div class="inspectorTitle">ПАРАМЕТРЫ <button id="reset">Сброс</button></div><div id="controls"></div></section></div><footer><div><span id="status">Готово к работе</span><progress id="progress" value="0" max="1"></progress></div><button id="folder">Папка результата</button><button class="primary" id="export">Экспортировать</button></footer></main></div><dialog id="reportDialog"><button id="closeReport">Закрыть</button><h2>Отчёт</h2><pre id="reportContent"></pre><button id="saveReport">Сохранить JSON</button></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
