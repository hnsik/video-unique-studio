<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Подготовка Video Unique Studio</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e8edf8;
        font:
          15px/1.65 "Segoe UI",
          sans-serif;
      }
      .card {
        width: min(620px, 90vw);
        padding: 38px;
        background: #151c2e;
        border: 1px solid #2e3c59;
        border-radius: 20px;
      }
      .logo {
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, #2563eb, #8955dc);
        border-radius: 13px;
        display: grid;
        place-items: center;
        font-size: 24px;
      }
      h1 {
        font-size: 25px;
        line-height: 1.3;
        margin: 20px 0 10px;
      }
      p {
        color: #a8b8d2;
      }
      .track {
        height: 8px;
        border-radius: 10px;
        background: #293753;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0;
        background: #7294ff;
        transition: width 0.2s;
      }
      small {
        display: block;
        color: #91a6c9;
        margin: 8px 0;
      }
      button {
        border: 1px solid #4c659c;
        border-radius: 8px;
        background: #294278;
        color: white;
        padding: 10px 14px;
        font: inherit;
        cursor: pointer;
        margin: 10px 8px 0 0;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      pre {
        font:
          12px/1.5 "Segoe UI",
          sans-serif;
        white-space: pre-wrap;
        color: #f2b2b9;
      }
      .muted {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">▶</div>
      <h1>Video Unique Studio</h1>
      <p id="message">Подготавливаем компоненты для обработки видео…</p>
      <div class="track"><div id="fill" class="fill"></div></div>
      <small id="details"></small>
      <pre id="error"></pre>
      <div>
        <button id="retry" hidden>Повторить</button
        ><button id="choose" hidden>Выбрать установленный FFmpeg</button>
      </div>
      <p class="muted">
        Уже установленные совместимые FFmpeg и FFprobe подключатся
        автоматически. Если их нет, программа скачает проверенную сборку.
        Node.js и Python устанавливать не нужно.
      </p>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
