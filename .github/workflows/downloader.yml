name: Downloader Windows EXE
on:
  push:
    branches: [downloader-windows]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencies and bundled FFmpeg
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller imageio-ffmpeg
          if ($LASTEXITCODE) { throw 'Dependency installation failed' }
          python -c "import base64,pathlib; pathlib.Path('app.ico').write_bytes(base64.b64decode(pathlib.Path('icon.b64').read_text()))"
          python -c "import imageio_ffmpeg, shutil; shutil.copyfile(imageio_ffmpeg.get_ffmpeg_exe(), 'ffmpeg.exe')"
          "$pwd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Tests
        run: python -m unittest -v test_backend test_worker
      - name: Package application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --hide-console hide-early --icon app.ico --add-data "app.ico;." --add-binary "ffmpeg.exe;." --collect-all gallery_dl --collect-all yt_dlp --collect-all curl_cffi --hidden-import test_backend --name VideoDownloaderStudio app.py
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          Copy-Item README_RU.md dist/VideoDownloaderStudio/
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed' }
      - name: Install and test packaged program
        shell: pwsh
        run: |
          $setup = (Get-ChildItem release/*Setup*.exe)[0].FullName
          $root = Join-Path $env:RUNNER_TEMP 'DownloaderInstalled'
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$root") -Wait -PassThru
          if ($p.ExitCode) { throw 'Installation failed' }
          $report = Join-Path $env:RUNNER_TEMP 'downloader-smoke.json'
          $p = Start-Process "$root/VideoDownloaderStudio.exe" -ArgumentList @('--self-test',$report) -PassThru -RedirectStandardOutput 'smoke.stdout' -RedirectStandardError 'smoke.stderr'
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Smoke timeout' }
          Get-Content smoke.stderr
          if ($p.ExitCode -or -not (Test-Path $report)) { throw 'Packaged smoke failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Smoke report failed' }
          Copy-Item $report release/
          $hash = (Get-FileHash $setup).Hash.ToLower()
          "$hash  $(Split-Path $setup -Leaf)" | Set-Content "$setup.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Downloader-Windows
          path: release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: Downloader-Diagnostics
          path: smoke.*
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Downloader-Windows
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: downloader-v1.1.0-${{ github.run_number }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Video Downloader Studio 1.1.0 — Windows' --notes 'Windows x64 installer with lemon icon, Python runtime and FFmpeg included. Tested installation, UI icon and local image/video downloads. Instagram/Facebook authentication is not tested. Unsigned build.' --latest=false
