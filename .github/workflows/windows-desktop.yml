name: Windows installer
on:
  push:
    branches: [desktop-windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - name: Prepare and validate native FFmpeg
        run: node desktop/scripts/ci-tools.cjs
      - run: npm test
      - run: npm run lint
      - run: npm test --prefix desktop
      - name: Build Windows x64 installer
        run: npm run dist:win --prefix desktop
      - name: Install and verify packaged app, auto-download, reuse and real native export
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop-dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'VUSInstalled'
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer exit $($installed.ExitCode)" }
          $appExe = Join-Path $installRoot 'Video Unique Studio.exe'
          if (-not (Test-Path $appExe)) {
            $fallback = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'Video Unique Studio.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($fallback) { $appExe = $fallback.FullName } else { throw 'Installed executable not found' }
          }
          foreach ($mode in @('download','reuse')) {
            $report = Join-Path $env:RUNNER_TEMP "desktop-smoke-$mode.json"
            $appArgs = @('--self-test', $report)
            if ($mode -eq 'download') { $appArgs += '--force-tool-download' }
            $process = Start-Process -FilePath $appExe -ArgumentList $appArgs -PassThru
            if (-not $process.WaitForExit(600000)) { $process.Kill(); throw 'Installed app test timed out' }
            if (-not (Test-Path $report)) { throw "No test report: $mode, exit $($process.ExitCode)" }
            Get-Content $report
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if (-not $result.ok -or $process.ExitCode -ne 0) { throw "Installed app test failed: $mode" }
            if ($mode -eq 'download' -and $result.tools.source -ne 'downloaded') { throw 'Auto-download was not verified' }
            if ($mode -eq 'reuse' -and $result.tools.source -eq 'downloaded') { throw 'Existing tools were not reused' }
            Copy-Item $report desktop-dist/
            Start-Sleep -Seconds 1
          }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Video-Unique-Studio-Windows-x64
          path: |
            desktop-dist/*Setup*.exe
            desktop-dist/*.sha256
            desktop-dist/desktop-smoke-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-build-diagnostics
          path: |
            ${{ runner.temp }}/desktop-smoke-*.json
            desktop-dist/builder-debug.yml
          if-no-files-found: ignore
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Video-Unique-Studio-Windows-x64
          path: installer
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: windows-v2.1.2-${{ github.run_number }}
        run: |
          cat > /tmp/vus-release-notes.md <<'NOTES'
          Windows 10/11 x64 installer for Video Unique Studio.

          Includes the application runtime. On first launch it finds compatible FFmpeg/FFprobe or downloads the pinned Gyan build and verifies SHA-256. No separate Node.js/Python installation is required.

          The installer was installed on a Windows runner and tested twice: automatic component download and reuse, native video/audio export, metadata cleanup, frame metrics, Chromium playback and reference deletion.

          This build is not code-signed. Windows may display a publisher/reputation warning.
          NOTES
          if gh release view "$RELEASE_TAG" --repo hnsik/video-unique-studio >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installer/* --repo hnsik/video-unique-studio --clobber
          else
            gh release create "$RELEASE_TAG" installer/* --repo hnsik/video-unique-studio --target "$GITHUB_SHA" --title "Video Unique Studio 2.1.2 — Windows x64" --notes-file /tmp/vus-release-notes.md --latest
          fi
